name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/web/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        env:
          NEXI_ENDPOINT: https://example.test/nexi
          NEXI_SUCCESS_URL: https://example.test/success
          NEXI_FAILURE_URL: https://example.test/failure
          SESSION_SECRET: ci-test-session-secret
          M4G_SITE_PASSWORD: test-m4g-password
        run: python -m unittest discover -s tests -p "test_*.py" -v
