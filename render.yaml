services:
  - type: web
    name: amaro-web
    runtime: python
    rootDir: apps/web
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    disk:
      name: amaro-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        value: sqlite:////data/amaro.db
      - key: UPLOAD_PATH
        value: /data/uploads
      - key: WATTLAB_RELEASES_DIR
        value: /data/releases/wattlab
      - key: SESSION_SECRET
        generateValue: true
