<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#4b0d36" />
    <title>{% block title %}{{ settings.app_name }}{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/styles.css') }}" />
  </head>
  <body>
    {% set _path = request.url.path if request else '' %}
    <header class="site-header">
      <div class="brand">
        <a href="/">
          <img
            src="{{ url_for('static', path='img/logo.png') }}"
            alt="{{ settings.app_name }}"
            class="brand__logo"
          />
        </a>
      </div>
      <nav class="site-nav" aria-label="Navigazione principale">
        <a href="/" {% if _path == '/' %}aria-current="page"{% endif %}>Home</a>
        <a href="/associazione" {% if _path.startswith('/associazione') %}aria-current="page"{% endif %}>Associazione</a>
        <a href="/calendario" {% if _path.startswith('/calendario') or _path.startswith('/eventi') %}aria-current="page"{% endif %}>Calendario</a>
        <a href="/tesseramento" {% if _path.startswith('/tesseramento') %}aria-current="page"{% endif %}>Tesseramento</a>
        <a
          class="nav-icon"
          href="/area-tesserati"
          aria-label="Area tesserati"
          title="Area tesserati"
          {% if _path.startswith('/area-tesserati') %}aria-current="page"{% endif %}
        >
          <img
            src="{{ url_for('static', path='img/logo_ap.png') }}"
            alt=""
          />
        </a>
      </nav>
    </header>

    <main class="page">
      {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
      <div class="site-footer__inner">
        <p>
          <strong>{{ settings.app_name }}</strong><br />
          <small class="muted">&copy; {{ current_year }} &middot; Tutti i diritti riservati</small>
        </p>
        <nav aria-label="Link utili">
          <a href="/associazione">Associazione</a>
          <a href="/calendario">Calendario</a>
          <a href="/tesseramento">Tesseramento</a>
          <a href="/area-tesserati">Area tesserati</a>
        </nav>
      </div>
    </footer>
  </body>
</html>
