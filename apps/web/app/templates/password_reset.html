{% extends "base.html" %}

{% block content %}
  <section class="section">
    <article class="card card--spacious">
      <h1>Reset password</h1>
      {% if reset_error %}
        <p class="alert">{{ reset_error }}</p>
        <a class="link link--block" href="/area-tesserati">Torna al login</a>
      {% elif token_valid %}
        <p class="muted">Inserisci una nuova password per l'area tesserati.</p>
        <form action="/area-tesserati/password-reset" method="post" class="form">
          <input type="hidden" name="token" value="{{ token }}" />
          <label for="new_password">Nuova password</label>
          <input id="new_password" name="password" type="password" required />

          <label for="new_password_confirm">Conferma password</label>
          <input id="new_password_confirm" name="password_confirm" type="password" required />

          <button class="btn btn-primary" type="submit">Aggiorna password</button>
        </form>
      {% else %}
        <p class="muted">Link di reset non valido.</p>
        <a class="link link--block" href="/area-tesserati">Torna al login</a>
      {% endif %}
    </article>
  </section>
{% endblock %}
