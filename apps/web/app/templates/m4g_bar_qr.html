{% extends "m4g_base.html" %}

{% block title %}QR Bar — Move for Gaza{% endblock %}

{% block content %}
  <div class="m4g-qr">
    <p class="m4g-hero__eyebrow" style="color: var(--m4g-muted);">Staff evento</p>
    <h1>QR Bar</h1>
    <p class="m4g-muted">Per cartelloni grandi usa Scarica SVG; il PNG è 30×30 cm a 900 dpi.</p>
    <div class="m4g-qr__preview">{{ qr_svg }}</div>
    <p style="margin-top: 1rem;">
      <a class="m4g-btn m4g-btn--secondary" href="{{ download_svg_href }}">Scarica SVG</a>
      <a class="m4g-btn m4g-btn--secondary" href="{{ download_png_href }}" style="margin-left: 0.5rem;">Scarica PNG 900 dpi</a>
    </p>
    <p style="margin-top: 1rem; word-break: break-all;"><a class="m4g-link" href="{{ bar_url }}">{{ bar_url }}</a></p>
    <p style="margin-top: 1.5rem;">
      <a class="m4g-btn m4g-btn--secondary" href="/m4g/bar">Apri menu bar</a>
    </p>
  </div>
{% endblock %}
