<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#009739" />
    <title>{% block title %}Move for Gaza{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/m4g-bar.css') }}" />
  </head>
  <body class="m4g-body">
    <header class="m4g-nav">
      <a href="/m4g/" class="m4g-nav__brand">
        <img src="{{ m4g.logo_url }}" alt="Move for Gaza" height="40" />
      </a>
      <nav class="m4g-nav__links">
        <a href="/m4g/iscrizione">Iscrizione</a>
        <a href="/m4g/bar">Bar</a>
      </nav>
    </header>
    {% block content %}{% endblock %}
    <footer class="m4g-footer">
      <p>{{ m4g.title }} — {{ m4g.location }}</p>
      <p class="m4g-muted">
        A sostegno di
        <a href="{{ m4g.beneficiary_url }}" class="m4g-link" target="_blank" rel="noreferrer">{{ m4g.beneficiary_name }}</a>
      </p>
    </footer>
  </body>
</html>
