[package]
name = "wattlab"
version = "0.1.1"
description = "Smart trainer control and recording"
authors = ["agolu"]
edition = "2021"

[lib]
name = "wattlab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread", "macros"] }
btleplug = "0.11"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
log = "0.4"
env_logger = "0.11"
futures = "0.3"
dirs = "6"
fitparser = "0.8"
quick-xml = "0.37"
base64 = "0.22"
tauri-plugin-http = "2.5.9"
